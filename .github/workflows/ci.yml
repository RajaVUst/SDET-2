name: UI & API Automation CI

on:
  push:
    branches:
      - main
      - master
      - capstone/310970-karthikeyan

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:

  playwright-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Install Dependencies
        working-directory: UI
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: UI
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASE_URL: ${{ secrets.KARTHIKEYAN_BASE_URL }}
          CARD_NAME: ${{ secrets.KARTHIKEYAN_CARD_NAME }}
          CARD_NUMBER: ${{ secrets.KARTHIKEYAN_CARD_NUMBER }}
          CARD_EXPIRY: ${{ secrets.KARTHIKEYAN_CARD_EXPIRY }}
          CARD_CVV: ${{ secrets.KARTHIKEYAN_CARD_CVV }}
          HEADLESS: true
        working-directory: UI
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: UI/playwright-report/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: UI/test-results/

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: UI/reports/

  api-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '22'
          cache: maven

      - name: Clear previous Allure results
        working-directory: FinalCapstoneApi
        run: rm -rf allure-results

      - name: Run Maven Tests
        working-directory: FinalCapstoneApi
        env:
          BASE_URL: ${{ secrets.KARTHIKEYAN_API_BASE_URL || 'https://demoqa.com' }}
        run: mvn clean test

      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: FinalCapstoneApi/allure-results
          allure_report: allure-report

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: FinalCapstoneApi/target/surefire-reports/

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: FinalCapstoneApi/allure-results/

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
