name: Playwright Tests

on:
  push:
    branches: [Chaithra_final_assessment]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'SDET-1/playwright/package-lock.json'
      
      - name: Install dependencies
        working-directory: SDET-1/playwright
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: SDET-1/playwright
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        working-directory: SDET-1/playwright
        run: npm test
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: SDET-1/playwright/test-results/
          retention-days: 30
      
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: SDET-1/playwright/playwright-report/
          retention-days: 30
      
      - name: Test Report Summary
        if: always()
        working-directory: SDET-1/playwright
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Playwright tests completed" >> $GITHUB_STEP_SUMMARY
          echo "Reports available in artifacts" >> $GITHUB_STEP_SUMMARY

