name: Automation Tests

on:
  push:
    branches: [Chaithra_final_assessment]
  pull_request:
    branches: [main, develop]

jobs:
  playwright:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'Testing_Assessment/playwright/package-lock.json'
      
      - name: Install dependencies
        working-directory: Testing_Assessment/playwright
        run: npm ci
      
      - name: Install Playwright browsers
        working-directory: Testing_Assessment/playwright
        run: npx playwright install --with-deps
      
      - name: Run Playwright tests
        working-directory: Testing_Assessment/playwright
        run: npm test
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.CHAITHRA_BASE_URL }}
          CARD_NUMBER: ${{ secrets.CHAITHRA_CARD_NUMBER }}
          CARD_EXPIRY: ${{ secrets.CHAITHRA_CARD_EXPIRY }}
          CARD_CVV: ${{ secrets.CHAITHRA_CARD_CVV }}
      
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: Testing_Assessment/playwright/playwright-report/
          retention-days: 30
      
      - name: Test Report Summary
        if: always()
        working-directory: Testing_Assessment/playwright
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Playwright tests completed" >> $GITHUB_STEP_SUMMARY
          echo "Reports available in artifacts" >> $GITHUB_STEP_SUMMARY

  restassured:
    name: Run RestAssured Tests
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: Testing_Assessment/restAssured/pom.xml

      - name: Run RestAssured tests
        working-directory: Testing_Assessment/restAssured
        run: mvn --batch-mode test
        env:
          BOOKSTORE_BASE_URL: ${{ secrets.CHAITHRA_BACKEND_BASE_URL }}
          PASSWORD: ${{ secrets.CHAITHRA_BACKEND_PASSWORD }}
