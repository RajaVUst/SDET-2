name: Final Assessment CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
      - ajay_Final_Assessment

  pull_request:

jobs:

  api-tests:
    name: API Automation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./API_FINAL_ASSESSMENT

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 22

      - name: Create API .env File
        run: |
          cat > .env << EOF
          BASE_URL=${{ secrets.BASE_URL }}
          USERNAME=${{ secrets.USERNAME }}
          PASSWORD=${{ secrets.PASSWORD }}
          EOF

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('API_FINAL_ASSESSMENT/pom.xml') }}

      - name: Build Project
        run: mvn clean compile

      - name: Run API Tests
        run: mvn test

      - name: Upload API Target
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-target
          path: API_FINAL_ASSESSMENT/target

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: API_FINAL_ASSESSMENT/allure-results

  ui-tests:
    name: Playwright UI Automation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Playwright_Final_Assessment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create UI .env File
        run: |
          cat > .env << EOF
          BASEURL=${{ secrets.BASE_URL }}
          NAME=${{ secrets.NAME }}
          EMAIL=${{ secrets.EMAIL }}
          PHONE=${{ secrets.PHONE }}
          CARD=${{ secrets.CARD }}
          EXPIRY=${{ secrets.EXPIRY }}
          CVV=${{ secrets.CVV }}
          EOF

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Final_Assessment/playwright-report

      - name: Upload Playwright Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: Playwright_Final_Assessment/test-results

  publish-reports:
    name: Publish Reports
    runs-on: ubuntu-latest

    needs:
      - api-tests
      - ui-tests

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: .