name: Playwright CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
      - ajay_Final_Assessment

  pull_request:

jobs:
  ui-tests:
    name: Playwright UI Automation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Playwright_Final_Assessment

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        env:
          BASEURL: ${{ secrets.BASE_URL }}
          NAME: ${{ secrets.NAME }}
          EMAIL: ${{ secrets.EMAIL }}
          PHONE: ${{ secrets.PHONE }}
          CARD: ${{ secrets.CARD }}
          EXPIRY: ${{ secrets.EXPIRY }}
          CVV: ${{ secrets.CVV }}
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright_Final_Assessment/playwright-report

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Playwright_Final_Assessment/test-results

  publish-reports:
    name: Publish Reports
    runs-on: ubuntu-latest

    needs:
      - ui-tests

    steps:
      - name: Download Reports
        uses: actions/download-artifact@v4

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: final-report
          path: .